name: Cross-Origin Storage build (macOS / Linux / Windows)

# Builds this branch's Firefox for all three desktop platforms and
# publishes each as a GitHub Release, so testers don't need to build from
# source themselves. This is a personal fork's workflow for one
# in-development feature branch, not part of mozilla-central's own CI --
# see .github/workflows/README before adding anything similar there.
#
# Manual dispatch only (not on every push): a full clean build across
# three platforms, with no incremental build caching, is expensive --
# each platform realistically takes 30-90+ minutes depending on runner
# performance, and there's no reason to pay that on every commit. Trigger
# it explicitly from the Actions tab (or `gh workflow run`) when you
# actually want fresh builds to hand out.
#
# Platform support note: macOS arm64 and Linux x86_64 have both been run
# and confirmed to publish successfully end-to-end. Windows x86_64 needs
# MozillaBuild pre-installed at C:\mozilla-build before `./mach` will run
# at all (a stock GitHub-hosted runner doesn't ship it, unlike
# mozilla-central's own purpose-built Windows CI image) -- installed
# explicitly as this workflow's first Windows-only step; `./mach
# bootstrap` still needs to successfully pull in the Visual Studio Build
# Tools/Windows SDK on top of that, which hasn't been confirmed to
# succeed non-interactively yet. Treat the Windows leg as best-effort
# until a run has actually gone green.

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS arm64
            os: macos-14
            artifact_glob: "obj-*/dist/*.dmg"
          - name: Linux x86_64
            os: ubuntu-22.04
            artifact_glob: "obj-*/dist/*.tar.@(bz2|xz)"
          - name: Windows x86_64
            os: windows-2022
            # `./mach package` on Windows produces a plain .zip directly
            # under obj-*/dist/ (like the other two platforms) -- the
            # self-extracting NSIS .installer.exe under dist/install/sea/
            # is a separate, additional build target this workflow
            # doesn't invoke, so glob for what actually gets produced.
            artifact_glob: "obj-*/dist/*.zip"

    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Install MozillaBuild (Windows only)
        if: matrix.os == 'windows-2022'
        shell: pwsh
        run: |
          # ./mach itself (build/mach_initialize.py) hard-requires
          # MozillaBuild pre-installed at exactly C:\mozilla-build before
          # it will run at all on Windows -- mozilla-central's own CI gets
          # this for free from a purpose-built Windows image; a stock
          # GitHub-hosted runner doesn't ship it, so install it explicitly
          # here, before the first `./mach` invocation of any kind.
          $installer = "$env:TEMP\MozillaBuildSetup.exe"
          Invoke-WebRequest -Uri "https://ftp.mozilla.org/pub/mozilla/libraries/win32/MozillaBuildSetup-Latest.exe" -OutFile $installer
          $proc = Start-Process -FilePath $installer -ArgumentList "/S", "/D=C:\mozilla-build" -PassThru -Wait
          if ($proc.ExitCode -ne 0) {
            Write-Error "MozillaBuild installer exited with code $($proc.ExitCode)"
            exit 1
          }
          if (-not (Test-Path "C:\mozilla-build")) {
            Write-Error "C:\mozilla-build does not exist after running the installer"
            exit 1
          }

      - name: mach bootstrap
        shell: bash
        run: ./mach bootstrap --application-choice=browser

      - name: mach build
        shell: bash
        run: ./mach build

      - name: mach package
        shell: bash
        run: ./mach package

      - name: Locate the packaged artifact
        id: artifact
        shell: bash
        run: |
          # extglob (for the Linux pattern's @(bz2|xz)) and nullglob (so a
          # non-matching pattern expands to nothing, not itself) are all
          # this needs -- none of the three patterns use `**`, and
          # globstar isn't available on macOS's ancient bundled bash 3.2
          # anyway (added in bash 4.0), which silently aborted this whole
          # step before it ever got to the actual glob.
          shopt -s extglob nullglob
          matches=(${{ matrix.artifact_glob }})
          if [ "${#matches[@]}" -eq 0 ]; then
            echo "No artifact matching ${{ matrix.artifact_glob }} found under obj-*/dist" >&2
            exit 1
          fi
          echo "path=${matches[0]}" >> "$GITHUB_OUTPUT"

      - name: Publish to the cross-origin-storage-latest release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: cross-origin-storage-latest
          name: Cross-Origin Storage (latest build)
          body: |
            Automated build of the `cross-origin-storage` branch at
            ${{ github.sha }}, for macOS arm64, Linux x86_64, and Windows
            x86_64.

            Cross-Origin Storage is enabled by default in this build, so
            `navigator.crossOriginStorage` is available immediately -- no
            `about:config` changes needed. Disable it via `about:config`
            (`dom.crossOriginStorage.enabled` = `false`) if needed.
          prerelease: true
          files: ${{ steps.artifact.outputs.path }}
